# Lenovo Yoga Book 9 13IRU8: the speaker correction Windows applies.
#
# ROUTING NEEDS NOTHING. The SOF "HDA Analog" PCM is fixed at 2 channels
# (spa.alsa: "audio.channels 4 out of range: 2-2"), and in 2-channel mode
# the codec shares the stream onto both speaker DACs -- /proc/asound/card0/
# codec#0 shows "Converter: stream=1, channel=0" on 0x02 (woofers) *and*
# 0x03 (tweeters) during playback. The old 4-channel upmix workaround never
# took effect on this driver.
#
# The EQ is Lenovo's own, extracted from the Windows driver package
#   Dolby/ext_lenovo_AIO_rtk/DEV_0287_SUBSYS_17AA3881_PCI_SUBSYS_384317AA.xml
# ("stand" mode, "music" profile):
#   high-shelf 1600 Hz  +5.00 dB  S=1.0   (S=1 -> Q 0.7071)
#   peaking    2500 Hz  -5.00 dB  Q=1.5
#   peaking    1500 Hz  +6.00 dB  Q=3.5
#   peaking     500 Hz  +3.00 dB  Q=0.5
# The two boosts above 1 kHz are applied at reduced gain (+3 and +4 dB):
# without Dolby's limiter the full values made the top end harsh.
#
# The 300 Hz low shelf stands in for Dolby's sliding-bass (up to +18.6 dB,
# more as level falls). bin/yoga-volume moves bassL/bassR:Gain with the
# volume; the value below is only the start-up setting.
#
# HEADROOM. Dolby relies on a limiter; PipeWire has none, so the input is
# trimmed by -6 dB (mixer gain 0.5) and the hardware volume carries the
# loudness. Without it dense material clips.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers (Yoga B&W)"
            media.name       = "Speakers (Yoga B&W)"
            filter.graph = {
                nodes = [
                    { type = builtin name = trimL label = mixer        control = { "Gain 1" = 0.5 } }
                    { type = builtin name = trimR label = mixer        control = { "Gain 1" = 0.5 } }
                    { type = builtin name = shL   label = bq_highshelf control = { "Freq" = 1600 "Q" = 0.7071 "Gain" =  3.0 } }
                    { type = builtin name = shR   label = bq_highshelf control = { "Freq" = 1600 "Q" = 0.7071 "Gain" =  3.0 } }
                    { type = builtin name = p1L   label = bq_peaking   control = { "Freq" = 2500 "Q" = 1.5    "Gain" = -5.0 } }
                    { type = builtin name = p1R   label = bq_peaking   control = { "Freq" = 2500 "Q" = 1.5    "Gain" = -5.0 } }
                    { type = builtin name = p2L   label = bq_peaking   control = { "Freq" = 1500 "Q" = 3.5    "Gain" =  4.0 } }
                    { type = builtin name = p2R   label = bq_peaking   control = { "Freq" = 1500 "Q" = 3.5    "Gain" =  4.0 } }
                    { type = builtin name = p3L   label = bq_peaking   control = { "Freq" =  500 "Q" = 0.5    "Gain" =  3.0 } }
                    { type = builtin name = p3R   label = bq_peaking   control = { "Freq" =  500 "Q" = 0.5    "Gain" =  3.0 } }
                    { type = builtin name = bassL label = bq_lowshelf  control = { "Freq" =  300 "Q" = 0.7071 "Gain" =  8.0 } }
                    { type = builtin name = bassR label = bq_lowshelf  control = { "Freq" =  300 "Q" = 0.7071 "Gain" =  8.0 } }
                ]
                links = [
                    { output = "trimL:Out" input = "shL:In" }
                    { output = "shL:Out"   input = "p1L:In" }
                    { output = "p1L:Out"   input = "p2L:In" }
                    { output = "p2L:Out"   input = "p3L:In" }
                    { output = "p3L:Out"   input = "bassL:In" }
                    { output = "trimR:Out" input = "shR:In" }
                    { output = "shR:Out"   input = "p1R:In" }
                    { output = "p1R:Out"   input = "p2R:In" }
                    { output = "p2R:Out"   input = "p3R:In" }
                    { output = "p3R:Out"   input = "bassR:In" }
                ]
                inputs  = [ "trimL:In 1" "trimR:In 1" ]
                outputs = [ "bassL:Out" "bassR:Out" ]
            }
            capture.props = {
                node.name        = "yoga_dolby"
                media.class      = Audio/Sink
                audio.channels   = 2
                audio.position   = [ FL FR ]
                priority.session = 2000
            }
            playback.props = {
                node.name      = "yoga_dolby_out"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                target.object  = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
            }
        }
    }
]

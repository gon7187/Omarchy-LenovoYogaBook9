# Auto-brightness settings.
# Changes take effect immediately; no restart needed.

# Show the on-screen brightness slider when brightness adjusts automatically.
show_osd = true

# Brightness curve: lux:percent anchors, interpolated logarithmically and
# clamped to the first and last point. Uncomment and retune by eye -- read the
# current level with:
#
#   journalctl --user -u yoga-autobrightness -f
#   brightnessctl -d intel_backlight -m
#
# The built-in default, fitted to this machine's sensor (~30 lux covered,
# 40-60 under normal indoor light, a few hundred by a window):
#
# curve = 20:5, 30:25, 40:55, 60:65, 150:82, 600:100

# HDR calibration, read by yoga-brightness-sync (not by the auto-brightness
# daemon) and used only while HDR is on (`yoga-mode hdr on`): the sdrbrightness
# Hyprland applies at 100% backlight. The sync scales it with the backlight
# level and never goes below 0.05, so this sets how bright "full" is in HDR.
# Values below 0.1 are raised to 0.1. Default 3.0:
#
# hdr_max_sdrbrightness = 3.0

# Lenovo Yoga Book 9 13IRU8: close the speaker PCM after 30 s of silence.
#
# Once the PCM closes and the codec and SOF DSP runtime-suspend, the TAS2781
# amps lose their calibration, and the driver skips rewriting it on the next
# open while the config number is unchanged (tasdevice_select_tuningprm_cfg,
# "Unneeded loading dsp conf"). bin/yoga-amp-arm sets Speaker Force Firmware
# Load, so every open reloads program, config and calibration (the open takes
# ~1 s instead of 0.02 s).
#
# This used to be 0 (never close), which kept the DSP, HDA link, codec and amps
# running silence: 0.65 W more on battery (90 s power_now averages, 2026-10-02).
# 30 s instead of WirePlumber's 5 s keeps short pauses from paying the reload.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 30
      }
    }
  }
]
